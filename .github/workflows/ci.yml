name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

env:
  HUSKY: "0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

  test-cross-platform:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      HUSKY: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js (for npm install path validation)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Core unit tests
        run: bun test --cwd packages/core test/global.test.ts

      - name: Build single binary smoke test
        run: bun run --cwd packages/agentx-cli script/build.ts --single

      - name: Verify binary starts (Unix)
        if: runner.os != 'Windows'
        run: ./packages/agentx-cli/bin/agentx --version

      - name: Verify binary starts (Windows)
        if: runner.os == 'Windows'
        run: .\packages\agentx-cli\bin\agentx.exe --version
