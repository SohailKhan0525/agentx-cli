name: Publish AgentX
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libsecret-1-dev

      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Verify build
        run: |
          head -1 packages/agentx/dist/index.js | grep "#!/usr/bin/env node"
          node packages/agentx/dist/index.js --version

      - name: Publish to NPM
        run: npm publish --workspace=packages/agentx --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        continue-on-error: true

      - name: Publish to GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
      - run: npm publish --workspace=packages/agentx --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Publish to JSR
        working-directory: packages/agentx
        run: npx jsr publish --allow-dirty
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        continue-on-error: true
