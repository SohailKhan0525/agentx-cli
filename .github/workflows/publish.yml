name: Build, Release & Publish AgentX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 1.20.93) — leave blank to use package.json version'
        required: false
        default: ''

permissions:
  contents: write
  packages: write
  id-token: write

env:
  HUSKY: "0"

jobs:
  build-and-publish:
    name: Build & Publish AgentX (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build Node.js bundle
        run: bun run --cwd packages/agentx-cli script/build.ts

      - name: Verify CLI with Node.js
        run: node packages/agentx-cli/dist/index.js --version

      # ─── GitHub Release ───────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_NAME="${{ github.ref_name }}"
          gh release create "$TAG_NAME" \
            --title "AgentX $TAG_NAME — Autonomous Website Builder" \
            --generate-notes \
            || gh release edit "$TAG_NAME" --title "AgentX $TAG_NAME — Autonomous Website Builder" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ─── NPM Publish ──────────────────────────────────────────────────────
      - name: Publish @agent-qofeno/agentx-cli to npm
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.NODE_AUTH_TOKEN != ''
        run: |
          echo "=== Publishing @agent-qofeno/agentx-cli to npm ==="
          CURRENT_VERSION=$(node -p "require('./packages/agentx-cli/package.json').version")
          echo "Version: $CURRENT_VERSION"

          if npm publish --workspace=packages/agentx-cli --provenance --access public 2>&1; then
            echo "✓ Published @agent-qofeno/agentx-cli@$CURRENT_VERSION with Provenance"
          else
            PUBLISHED_VERSION=$(npm view "@agent-qofeno/agentx-cli" version 2>/dev/null || echo "")
            if [ "$PUBLISHED_VERSION" = "$CURRENT_VERSION" ]; then
              echo "⚠ @agent-qofeno/agentx-cli@$CURRENT_VERSION already published (skipping)"
            else
              echo "✗ Failed to publish @agent-qofeno/agentx-cli@$CURRENT_VERSION"
              exit 1
            fi
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish summary
        if: always()
        run: |
          VERSION=$(node -p "require('./packages/agentx-cli/package.json').version")
          echo "## 📦 Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Version | Distribution |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|---------|--------------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`@agent-qofeno/agentx-cli\` | \`$VERSION\` | Universal Node.js Bundle (\`dist/index.js\`) |" >> $GITHUB_STEP_SUMMARY

