name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - ci
      - dev
      - beta
      - snapshot-*
  workflow_dispatch:
    inputs:
      bump:
        description: Bump major, minor, or patch
        required: false
        type: choice
        options: [major, minor, patch]
      version:
        description: Override version
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  contents: write
  id-token: write

jobs:
  version:
    if: github.repository == 'SohailKhan0525/agentx-cli'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.AGENTX_APP_ID || secrets.AGENTX_APP_ID }}
          opencode-app-secret: ${{ secrets.AGENTX_APP_SECRET }}
      - name: Install AgentX Code
        if: inputs.bump || inputs.version
        run: bun install --global @agent-qofeno/agentx-cli
      - id: version
        run: ./script/version.ts
        env:
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          AGENTX_BUMP: ${{ inputs.bump }}
          AGENTX_VERSION: ${{ inputs.version }}
          GH_REPO: ${{ (github.ref_name == 'beta' && 'SohailKhan0525/agentx-cli-beta') || github.repository }}

  build-cli:
    needs: version
    if: github.repository == 'SohailKhan0525/agentx-cli'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
        with:
          fetch-tags: true
      - uses: ./.github/actions/setup-bun
      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.AGENTX_APP_ID || secrets.AGENTX_APP_ID }}
          opencode-app-secret: ${{ secrets.AGENTX_APP_SECRET }}
      - name: Build
        run: |
          ./packages/agentx/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
          ./packages/cli/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          AGENTX_VERSION: ${{ needs.version.outputs.version }}
          AGENTX_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentx-cli
          path: packages/agentx/dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agentx-preview-cli
          path: packages/cli/dist/cli-*

  publish:
    needs: [version, build-cli]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentx-cli
          path: packages/agentx/dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agentx-preview-cli
          path: packages/cli/dist
      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          opencode-app-id: ${{ vars.AGENTX_APP_ID || secrets.AGENTX_APP_ID }}
          opencode-app-secret: ${{ secrets.AGENTX_APP_SECRET }}
      - run: ./script/publish.ts
        env:
          AGENTX_VERSION: ${{ needs.version.outputs.version }}
          AGENTX_RELEASE: ${{ needs.version.outputs.release }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
