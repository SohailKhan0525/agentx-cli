name: Build & Publish AgentX

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun run lint

      - name: Build packages for all platforms
        run: bun run --cwd packages/agentx-cli script/build.ts

      - name: Create GitHub Release & Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release create ${{ github.ref_name }} --title "AgentX ${{ github.ref_name }} — Autonomous Website Builder" --generate-notes || true
          for dir in packages/agentx-cli/dist/@agent-qofeno/*; do
            pkg_name=$(basename "$dir")
            if [[ "$pkg_name" == *"windows"* ]]; then
              (cd "$dir/bin" && zip -r "../../../../$pkg_name.zip" *)
              gh release upload ${{ github.ref_name }} "$pkg_name.zip" --clobber || true
            else
              (cd "$dir/bin" && tar -czf "../../../../$pkg_name.tar.gz" *)
              gh release upload ${{ github.ref_name }} "$pkg_name.tar.gz" --clobber || true
            fi
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.NODE_AUTH_TOKEN != ''
        run: |
          npm publish --workspace=packages/agentx-cli --access public || echo "Version already published on NPM"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
