name: Publish AgentX

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['18', '20', '22']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: node dist/index.js --version

  publish-jsr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Publish to JSR with OIDC Provenance
        run: npx jsr publish --allow-dirty

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - name: Verify
        run: |
          head -1 dist/index.js | grep "#!/usr/bin/env node"
          node dist/index.js --version
      - name: Publish to NPM with Provenance
        run: npm publish --access public --provenance || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-gpr:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@SohailKhan0525'
      - run: npm ci
      - run: npm run build
      - name: Configure package name for GPR
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(fs.readFileSync('package.json','utf8'));
            p.name = '@SohailKhan0525/agentx-cli';
            p.repository = { type: 'git', url: 'git+https://github.com/SohailKhan0525/agentx-cli.git' };
            p.publishConfig = { registry: 'https://npm.pkg.github.com' };
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2));
          "
      - name: Publish to GitHub Packages
        run: npm publish || true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  publish-homebrew:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: ver
        run: echo "v=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Wait for NPM package to be available
        run: sleep 10
      - name: Get SHA256 from NPM
        id: sha
        run: |
          URL="https://registry.npmjs.org/@agent-qofeno/agentx-cli/-/agentx-cli-${{ steps.ver.outputs.v }}.tgz"
          SHA=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
      - uses: actions/checkout@v4
        with:
          repository: SohailKhan0525/homebrew-agentx
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - name: Update Homebrew formula
        run: |
          cat > homebrew-tap/Formula/agentx.rb << EOF
          class Agentx < Formula
            desc "AI agent that builds production-ready websites from your terminal"
            homepage "https://github.com/SohailKhan0525/agentx-cli"
            url "${{ steps.sha.outputs.url }}"
            sha256 "${{ steps.sha.outputs.sha }}"
            license "MIT"

            depends_on "node"

            def install
              system "npm", "install", *Language::Node.std_npm_install_args(libexec)
              bin.install_symlink Dir["#{libexec}/bin/*"]
            end

            test do
              system "#{bin}/agentx", "--version"
            end
          end
          EOF
      - name: Push formula update
        run: |
          cd homebrew-tap
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git add Formula/agentx.rb
          git commit -m "agentx ${{ steps.ver.outputs.v }}" || true
          git push
        continue-on-error: true

  create-release:
    needs: [publish-npm, publish-jsr, publish-gpr, publish-homebrew]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Create Release Tarballs & Checksums
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm pack
          sha256sum *.tgz > SHA256SUMS
          cat << 'EOF' > release_notes.md
          ## AgentX Release

          - **Terminal UI**: Monochromatic Ink layout inspired by Claude Code
          - **Agent Brain**: Autonomous website builder engine
          - **Provenance**: Cryptographically signed build attestations
          - **Multiplatform**: Tested on Windows, macOS, and Linux runners
          - **JSR 100% Score**: Complete TypeScript definitions with full JSDoc

          ### Install
          ```bash
          # npm
          npm install -g @agent-qofeno/agentx-cli

          # Homebrew
          brew tap SohailKhan0525/agentx && brew install agentx

          # JSR
          npx jsr add @agent-qofeno/agentx-cli

          # GitHub Packages
          npm install -g @SohailKhan0525/agentx-cli --registry https://npm.pkg.github.com
          ```
          EOF
          gh release create "v${VERSION}" *.tgz SHA256SUMS --title "AgentX v${VERSION}" --notes-file release_notes.md || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
